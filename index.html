<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Marcador de Consumo Alimentar — Sistema de registro de consumo alimentar baseado no SISVAN. Escolha um perfil para iniciar.">
  <meta name="keywords" content="consumo alimentar, SISVAN, nutrição, marcador alimentar, saúde, alimentação">
  <meta name="author" content="Marcador Alimentar">
  <meta name="theme-color" content="#1D9E75">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Open Graph -->
  <meta property="og:title" content="Marcador de Consumo Alimentar">
  <meta property="og:description" content="Sistema de registro de consumo alimentar baseado no SISVAN.">
  <meta property="og:type" content="website">

  <title>Marcador de Consumo Alimentar — Escolher perfil</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <i class="ti ti-salad"></i>
        <h1>Marcador Alimentar</h1>
        <p>Consumo Alimentar — SISVAN</p>
      </div>

      <div class="profile-heading">
        <h2>Quem está usando?</h2>
        <p>Toque no perfil para continuar.</p>
      </div>

      <div class="profile-grid" aria-label="Escolha de perfil">
        <button class="profile-card" type="button" onclick="selectProfile('b4d5b1a2-a7e7-47ad-9f2a-b6b1abede8af')">
          <span class="profile-avatar green">MB</span>
          <span class="profile-name">Marcelo</span>
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
        </button>
        <button class="profile-card" type="button" onclick="selectProfile('db66d658-c489-41a0-8f00-0c3831e10742')">
          <span class="profile-avatar blue">MA</span>
          <span class="profile-name">Mariana Aires</span>
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="shared-access-note">
        <i class="ti ti-users" aria-hidden="true"></i>
        <span>Acesso compartilhado: não é necessário usar senha.</span>
      </div>

      <!-- Footer -->
      <div class="auth-footer">
        © 2026 Marcador de Consumo Alimentar · SISVAN
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>

</body>
</html>
